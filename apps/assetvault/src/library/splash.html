body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;
  --av-window-radius:12px;border-radius:var(--av-window-radius);clip-path:inset(0 round var(--av-window-radius));isolation:isolate;
  background:transparent;color:#e1e7ed;font-synthesis:none;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
/* 不把背景画在 body 上：浏览器会将其传播到文档画布，填满透明圆角。 */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;border-radius:var(--av-window-radius);background-color:#04070a;
  background-image:radial-gradient(circle at 50% 30%,rgba(200,243,83,.05) 0%,transparent 60%),
    radial-gradient(circle at 80% 80%,rgba(20,35,50,.4) 0%,transparent 50%)}
/* 两团缓慢漂移的黄绿光斑 */
.stage:before,.stage:after{content:"";position:fixed;border-radius:50%;filter:blur(72px);pointer-events:none;z-index:-1}
.stage:before{width:430px;height:430px;left:-130px;top:-150px;background:radial-gradient(circle,rgba(200,243,83,.12),transparent 66%);animation:drift 15s ease-in-out infinite}
.stage:after{width:390px;height:390px;right:-140px;bottom:-160px;background:radial-gradient(circle,rgba(111,163,77,.1),transparent 66%);animation:drift 19s ease-in-out infinite reverse}
@keyframes drift{50%{transform:translate(28px,22px) scale(1.09)}}

.stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:15px;padding:22px}

/* 卡片仅作布局容器：无底色无边框，内容直接浮在背景上 */
.card{position:relative;width:min(90vw,398px);padding:34px 32px 27px;text-align:center;
  animation:cardIn .8s cubic-bezier(.16,1,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
/* 入场弹入（与搜索界面主题 Chip 同款弹簧节奏） */
@keyframes rise-pop{0%{opacity:0;transform:translateY(14px) scale(.92)}65%{opacity:1;transform:translateY(-3px) scale(1.02)}100%{opacity:1;transform:none}}

/* 吉祥物：一块会蹦的方糖，落地时压扁、腾空时拉长 */
.mascot{position:relative;height:126px;display:grid;place-items:center;cursor:pointer;user-select:none;
  animation:rise-pop .62s cubic-bezier(.34,1.56,.64,1) .22s backwards}
.mascot img{position:relative;z-index:2;width:112px;height:112px;transform-origin:50% 88%;
  animation:hop 1.4s cubic-bezier(.36,.07,.28,1) infinite;transition:filter .3s ease}
.mascot:hover img{filter:drop-shadow(0 0 14px rgba(200,243,83,.28))}
.mascot .shadow{position:absolute;bottom:3px;width:72px;height:13px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.66),transparent 72%);
  animation:shade 1.4s cubic-bezier(.36,.07,.28,1) infinite}
@keyframes hop{
  0%,100%{transform:translateY(0) scale(1.05,.94)}
  9%{transform:translateY(1px) scale(1.1,.89)}
  38%{transform:translateY(-21px) scale(.95,1.07)}
  58%{transform:translateY(-23px) scale(1,1)}
  89%{transform:translateY(0) scale(1.07,.92)}}
@keyframes shade{
  0%,100%{transform:scale(1);opacity:.5}
  9%{transform:scale(1.13);opacity:.56}
  48%{transform:scale(.64);opacity:.19}
  89%{transform:scale(1.09);opacity:.52}}
.card.done .mascot img{animation:cheer .9s cubic-bezier(.3,1.4,.4,1) 1 both}
.card.done .mascot .shadow{animation:none;opacity:.34;transform:scale(1)}
@keyframes cheer{
  0%{transform:translateY(0) scale(1.05,.94)}
  26%{transform:translateY(-36px) scale(.92,1.11) rotate(-9deg)}
  56%{transform:translateY(0) scale(1.15,.85) rotate(6deg)}
  76%{transform:translateY(-10px) scale(1,1) rotate(-2deg)}
  100%{transform:none}}

/* 吉祥物周围的柔和光尘：无硬边、轨迹飘逸（随进度增亮加速） */
.bit{position:absolute;width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle,rgba(224,255,160,.95) 0%,rgba(200,243,83,.5) 42%,rgba(200,243,83,0) 72%);
  opacity:.32;transition:opacity .5s ease;will-change:transform}
.bit:after{content:"";position:absolute;inset:-5px;border-radius:50%;
  background:radial-gradient(circle,rgba(200,243,83,.22) 0%,transparent 70%)}
.b1{left:7%;top:27%;--ax:7px;--ay:-13px;animation:float 5.2s ease-in-out infinite}
.b2{right:9%;top:15%;--ax:-6px;--ay:-10px;animation:float 6.1s ease-in-out .5s infinite}
.b3{left:15%;bottom:17%;--ax:9px;--ay:-12px;animation:float 5.6s ease-in-out 1s infinite}
.b4{right:13%;bottom:25%;--ax:-8px;--ay:-14px;animation:float 6.6s ease-in-out 1.6s infinite}
.b5{left:2%;bottom:40%;--ax:6px;--ay:-11px;animation:float 5.9s ease-in-out .7s infinite}
.b6{right:3%;bottom:46%;--ax:-7px;--ay:-13px;animation:float 6.3s ease-in-out 1.3s infinite}
.b7{left:33%;top:8%;--ax:5px;--ay:-9px;animation:float 6.8s ease-in-out .3s infinite}
.b8{right:31%;bottom:8%;--ax:-5px;--ay:-12px;animation:float 5.4s ease-in-out 1.9s infinite}
@keyframes float{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(var(--ax),var(--ay)) scale(1.18)}
  66%{transform:translate(calc(var(--ax) * -.7),calc(var(--ay) * .55)) scale(.86)}}

h1{margin:16px 0 0;font-size:22px;font-weight:700;letter-spacing:-.4px;
  animation:rise-pop .62s cubic-bezier(.34,1.56,.64,1) .3s backwards}
.sub{margin:7px 0 0;font-size:10px;letter-spacing:2.6px;color:#627282;
  animation:rise-pop .62s cubic-bezier(.34,1.56,.64,1) .38s backwards}

/* 进度条：小吉祥物骑在进度头上往前挪 */
.track{position:relative;height:11px;margin:26px 4px 0;border-radius:999px;
  background:#080c11;box-shadow:inset 0 1px 2px rgba(0,0,0,.45);
  animation:rise-pop .62s cubic-bezier(.34,1.56,.64,1) .46s backwards}
.fill{position:absolute;left:1px;top:1px;bottom:1px;width:0;border-radius:999px;
  background:linear-gradient(90deg,rgba(200,243,83,.5),#c8f353);
  animation:fill-pulse 2.4s ease-in-out infinite}
@keyframes fill-pulse{0%,100%{box-shadow:0 0 12px rgba(200,243,83,.22)}50%{box-shadow:0 0 24px rgba(200,243,83,.42)}}
.fill:after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:repeating-linear-gradient(118deg,rgba(255,255,255,.3) 0 6px,transparent 6px 15px);
  animation:stripe 1.05s linear infinite}
@keyframes stripe{to{background-position:26px 0}}
/* 小吉祥物骑在进度头上往前挪。它和进度条同为黄绿色，所以要用一圈深色投影把它从条上托起来 */
.runner{position:absolute;top:-18px;left:1px;width:24px;height:24px;margin-left:-12px;
  filter:drop-shadow(0 0 2px #0d131a) drop-shadow(0 1px 3px rgba(0,0,0,.7));
  animation:bob .62s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(7deg)}}

.meta{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:15px 4px 0;font-size:11px;
  animation:rise-pop .62s cubic-bezier(.34,1.56,.64,1) .56s backwards}
/* 文案切换只做淡入淡出 + 轻微缩放：不再用 translateY。整张卡片是垂直居中的，任何一行
   产生高度或位移变化都会把进度条一起顶上去，所以这里的动画一律不许改布局。 */
.msg{min-width:0;color:#627282;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:opacity .22s ease}
.msg.swap{opacity:0}
.msg.unswap{animation:msg-pop .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes msg-pop{0%{opacity:0;transform:scale(.96)}60%{opacity:1;transform:scale(1.02)}100%{opacity:1;transform:none}}
.pct{color:#c8f353;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:.4px;display:inline-block}
.pct.bump{animation:pct-pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pct-pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
/* 提示行固定占两行高度（37px = 2 × 10px × 1.85）：出错时要写长文案，但空着时也必须占位，
   否则它一出现/消失，居中布局就会把进度条上下顶一截。 */
.tip{margin:18px 0 0;height:37px;overflow:hidden;font-size:10px;line-height:1.85;color:#627282;
  animation:rise-pop .62s cubic-bezier(.34,1.56,.64,1) .64s backwards}

/* 粒子：柔光圆点 + 少量流光拖尾，带轻微重力弧线 */
.spark{position:absolute;pointer-events:none;border-radius:50%;width:var(--s,5px);height:var(--s,5px);
  background:radial-gradient(circle,rgba(224,255,160,.95) 0%,rgba(200,243,83,.55) 42%,rgba(200,243,83,0) 72%);
  animation:spark-fly var(--dur,.8s) cubic-bezier(.16,.84,.32,1) forwards}
.spark.streak{height:2px;border-radius:999px;
  background:linear-gradient(90deg,rgba(200,243,83,0) 0%,rgba(224,255,160,.9) 50%,rgba(200,243,83,0) 100%)}
@keyframes spark-fly{
  0%{opacity:0;transform:translate(0,0) rotate(var(--rot,0deg)) scale(.25)}
  15%{opacity:.95;transform:translate(calc(var(--dx) * .22),calc(var(--dy) * .22)) rotate(var(--rot,0deg)) scale(1)}
  55%{opacity:.7;transform:translate(calc(var(--dx) * .68),calc(var(--dy) * .68)) rotate(var(--rot,0deg)) scale(.8)}
  100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 14px)) rotate(var(--rot,0deg)) scale(.12)}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}


/* Keep the loading card visible across the native-to-web handoff. */
.card,.mascot,h1,.sub,.track,.meta,.tip{animation:none}
</style>
</head>
<body>
<main class="stage">
  <section class="card" id="card">
    <div class="mascot" id="mascot">
      <span class="shadow"></span>
      <img id="hero" src="/mascot.png" alt="Arvimo" draggable="false">
      <i class="bit b1"></i><i class="bit b2"></i><i class="bit b3"></i><i class="bit b4"></i>
      <i class="bit b5"></i><i class="bit b6"></i><i class="bit b7"></i><i class="bit b8"></i>
    </div>
    <h1>Arvimo</h1>
    <div class="track">
      <div class="fill" id="fill"></div>
      <img class="runner" id="runner" src="/mascot.png" alt="" draggable="false">
    </div>
    <div class="meta">
      <span class="msg" id="msg"></span>
      <span class="pct" id="pct">0%</span>
    </div>
    <p class="tip" id="tip"></p>
  </section>
</main>
<script src="/splash.js"></script>
</body>
</html>
