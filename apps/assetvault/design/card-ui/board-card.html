<style id="asset-card-styles">
.model-card {
  border: 1px solid #27303b;
  border-radius: 10px;
  overflow: hidden;
  background: #151c25;
  transition:
    transform .2s,
    border-color .2s,
    box-shadow .2s;
  min-width: 0;
}
.model-card:hover {
  transform: translateY(-3px);
  border-color: #506049;
  box-shadow: 0 12px 24px #0002;
}
.model-card.is-moving {
  transition:
    translate .26s cubic-bezier(.22, .61, .36, 1),
    transform .2s,
    border-color .2s,
    box-shadow .2s;
}
.model-card.selected {
  border-color: #c9f58199;
  box-shadow: 0 0 0 1px #c9f58120;
}
.card-media {
  aspect-ratio: 1;
  position: relative;
  background: #202832;
  overflow: hidden;
  isolation: isolate;
}
.card-media.is-broken img {
  visibility: hidden;
}
.card-media.is-broken::after {
  content: "\7f29\7565\56fe\52a0\8f7d\5931\8d25  \b7  \70b9\5f00\770b\539f\56fe";
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  text-align: center;
  font-size: 12px;
  line-height: 1.5;
  color: #7d8b9b;
  background: #202832;
}
.card-media:after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      0deg,
      #00000014,
      transparent 40%);
  pointer-events: none;
}
.thumbnail {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform .45s;
}
.model-card:hover .thumbnail {
  transform: scale(1.04);
}
.image-placeholder {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #6d7e91;
  background:
    radial-gradient(
      ellipse at 50% 45%,
      #334051,
      #202934 65%);
  gap: 9px;
}
.image-placeholder i {
  width: 38px;
  height: 38px;
  opacity: .7;
}
.image-placeholder span {
  font-size: 10px;
}
.preview-hit {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}
.preview-hit span {
  opacity: 0;
  color: #fff;
  text-shadow: 0 1px 3px #000c;
  border-radius: 25px;
  padding: 9px 14px;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 7px;
  transform: translateY(8px);
  transition: .2s;
}
.preview-hit:hover span,
.preview-hit:focus-visible span {
  opacity: 1;
  transform: translateY(0);
}
.card-type {
  position: absolute;
  left: 10px;
  top: 10px;
  background: #121923b3;
  backdrop-filter: blur(6px);
  padding: 4px 6px;
  border-radius: 4px;
  font-size: 8px;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 4px;
  pointer-events: none;
  color: #d1dce6;
  z-index: 2;
}
.card-type i {
  width: 10px;
  height: 10px;
}
.favorite {
  position: absolute;
  right: 9px;
  top: 9px;
  z-index: 3;
  color: #c3cdd7;
  background: #1119238c;

  height: 26px;
  border-radius: 6px;

}
.favorite i {

}

}
.card-select {

}

}
.card-meta {

}
.card-title {

  font-size: 12px;

function setLayout(section,mode){const card=section.querySelector('.pkg-collection');card.classList.remove('pkg-c4','pkg-c6','pkg-c9','pkg-wide');card.classList.add('pkg-c'+mode[0]);if(mode==='6h')card.classList.add('pkg-wide');section.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===mode)));}
document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>setLayout(b.closest('.preview-section'),b.dataset.layout));
document.querySelectorAll('.favorite').forEach(b=>b.onclick=()=>{b.classList.toggle('saved');b.setAttribute('aria-pressed',String(b.classList.contains('saved')));});
document.querySelectorAll('.pkg-resize').forEach(handle=>handle.onpointerdown=e=>{e.preventDefault();const section=handle.closest('.preview-section'),x=e.clientX,y=e.clientY;handle.setPointerCapture(e.pointerId);handle.onpointermove=move=>{const dx=move.clientX-x,dy=move.clientY-y;if(Math.abs(dx)<22&&Math.abs(dy)<22)return;setLayout(section,dx>90&&dy>90?'9':dx>35&&dx>dy?'6h':dy>35?'6v':'4');};handle.onpointerup=handle.onpointercancel=()=>{handle.onpointermove=null;};});</script></body></html>
