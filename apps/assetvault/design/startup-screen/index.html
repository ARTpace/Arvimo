<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AssetVault · 正在启动</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <section class="card" id="card">
    <div class="mascot" id="mascot">
      <span class="shadow"></span>
      <img id="hero" src="logo.png" alt="AssetVault" draggable="false">
      <i class="bit b1"></i><i class="bit b2"></i><i class="bit b3"></i><i class="bit b4"></i>
    </div>
    <h1>AssetVault</h1>
    <p class="sub">本地 3D 模型库</p>
    <div class="track">
      <div class="fill" id="fill"></div>
      <img class="runner" id="runner" src="logo.png" alt="" draggable="false">
    </div>
    <div class="meta">
      <span class="msg" id="msg"></span>
      <span class="pct" id="pct">0%</span>
    </div>
    <p class="tip" id="tip">正在准备模型库，马上就好…</p>
  </section>
  <p class="foot">AssetVault <span id="ver"></span> · 仅本机访问</p>
</main>
<script src="animation.js"></script>
</body>
</html>
