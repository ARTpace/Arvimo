[package]
name = "assetvault"
version = "0.1.18"
description = "AssetVault - Sketchfab 模型导出与本地库桌面版"
authors = ["AssetVault"]
edition = "2021"
default-run = "assetvault"

[features]
installer-ui = ["dep:wry", "dep:tao"]

[[bin]]
name = "assetvault-setup"
path = "src/installer.rs"
required-features = ["installer-ui"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }
# 授权：Ed25519 验签 + 注册表读硬件指纹
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
sha2 = "0.10"
winreg = "0.55"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
# 原生拖出（dragout.rs）：IDataObject/IDropSource + GlobalAlloc + 窗口反查进程。
# windows-core 必须单列：#[implement] 展开出来的代码直接引用 windows_core::…。
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
