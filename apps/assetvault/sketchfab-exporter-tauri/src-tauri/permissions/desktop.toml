[[permission]]
identifier = "desktop-controls"
description = "Allow the main local-library window to use AssetVault desktop commands."
commands.allow = [
  "autostart_status", "autostart_set",
  "desktop_window_action", "hide_to_tray", "quit_app", "open_external", "close_ui_ready",
  "backend_startup_error", "backend_ready_url", "open_ready_library", "license_info", "activate_with",
  "check_app_update", "download_app_update", "install_app_update", "start_file_drag"
]
