<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; img-src 'self' data:" />
  <title>Arvimo · 艺团</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #10151d;
      color: #c9d4e3;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 18px;
      user-select: none;
      -webkit-user-select: none;
    }

    #activation { width: 480px; background: #161c26; border: 1px solid #24303f; border-radius: 14px; padding: 26px 28px 22px; }
    #activation h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; color: #e8eef7; letter-spacing: .3px; }
    .act-sub { font-size: 13px; line-height: 1.6; color: #8d9bb0; margin: 0 0 18px; }
    .act-label { font-size: 12px; color: #7d8ba0; margin: 0 0 6px; letter-spacing: .4px; }
    .act-machine-row { display: flex; align-items: center; gap: 10px; background: #10151d; border: 1px solid #24303f; border-radius: 8px; padding: 9px 12px; margin-bottom: 16px; }
    #act-machine { font-family: Consolas, "Courier New", monospace; font-size: 11.5px; line-height: 1.5; color: #8fc4ff; user-select: text; -webkit-user-select: text; flex: 1; word-break: break-all; }
    #act-copy { flex: none; font-size: 12px; padding: 5px 10px; border-radius: 6px; border: 1px solid #2c3a4d; background: #1b232f; color: #a9b8cc; cursor: pointer; }
    #act-copy:hover { border-color: #3d5471; color: #d6e2f2; }
    #act-license { width: 100%; box-sizing: border-box; min-height: 92px; resize: vertical; background: #10151d; border: 1px solid #24303f; border-radius: 8px; padding: 11px 12px; color: #e8eef7; font-family: Consolas, "Courier New", monospace; font-size: 12px; line-height: 1.5; outline: none; user-select: text; -webkit-user-select: text; word-break: break-all; }
    #act-license:focus { border-color: #3d5471; }
    #act-license::placeholder { color: #4f5c6e; }
    #act-key { width: 100%; box-sizing: border-box; background: #10151d; border: 1px solid #24303f; border-radius: 8px; padding: 11px 12px; color: #e8eef7; font-family: Consolas, "Courier New", monospace; font-size: 14px; letter-spacing: 1.4px; outline: none; user-select: text; -webkit-user-select: text; }
    #act-key:focus { border-color: #3d5471; }
    #act-key::placeholder { color: #4f5c6e; letter-spacing: 1.4px; }
    #act-submit, #act-submit-online { width: 100%; margin-top: 14px; padding: 11px; border: none; border-radius: 8px; background: #2f6fd0; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
    #act-submit:hover, #act-submit-online:hover { background: #3a7de0; }
    #act-submit:disabled, #act-submit-online:disabled { background: #2a3546; color: #6f7d91; cursor: default; }
    .act-status { min-height: 18px; margin-top: 12px; font-size: 12.5px; line-height: 1.5; color: #8d9bb0; }
    .act-status.ok { color: #4fb477; }
    .act-status.err { color: #e0796f; }
    .act-hint { margin: 16px 0 0; padding-top: 14px; border-top: 1px solid #1e2733; font-size: 11.5px; line-height: 1.6; color: #64738a; }
    .act-alt { margin: 12px 0 0; text-align: center; }
    .act-alt button { background: none; border: none; padding: 2px 4px; color: #6b7f9c; font-size: 11.5px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    .act-alt button:hover { color: #9db4d4; }
  </style>
  <link rel="stylesheet" href="splash.css">
  <style>[hidden]{display:none!important}</style>
</head>
<body>
  <!-- startup:start -->
<div id="boot"><main class="stage">
  <section class="card" id="card">
    <div class="mascot" id="mascot">
      <span class="shadow"></span>
      <img id="hero" src="/mascot.png" alt="Arvimo · 艺团" draggable="false">
      <i class="bit b1"></i><i class="bit b2"></i><i class="bit b3"></i><i class="bit b4"></i>
      <i class="bit b5"></i><i class="bit b6"></i><i class="bit b7"></i><i class="bit b8"></i>
    </div>
    <h1>Arvimo · 艺团</h1>
    <p class="sub">素材库与创作画布</p>
    <div class="track">
      <div class="fill" id="fill"></div>
      <img class="runner" id="runner" src="/mascot.png" alt="" draggable="false">
    </div>
    <div class="meta">
      <span class="msg" id="msg" role="status" aria-live="polite"></span>
      <span class="pct" id="pct">0%</span>
    </div>
    <p class="tip" id="tip">正在准备模型库，马上就好…</p>
  </section>
</main></div>
<!-- startup:end -->

  <section id="activation" hidden>
    <h1>激活 Arvimo · 艺团</h1>
    <p class="act-sub">把下面的机器指纹复制发给发行方，会得到一份授权文件。粘贴进来点激活即可，全程不需要联网。</p>

    <p class="act-label">本机机器指纹（复制发给发行方）</p>
    <div class="act-machine-row">
      <span id="act-machine">…</span>
      <button id="act-copy" type="button">复制</button>
    </div>

    <form id="act-form" onsubmit="return false">
      <p class="act-label">授权文件</p>
      <textarea id="act-license" spellcheck="false" autocomplete="off" placeholder="粘贴发行方回传的授权文件（AVLIC1.…）"></textarea>
      <button id="act-submit" type="button">激活</button>
    </form>

    <div class="act-status" id="act-status"></div>
    <p class="act-hint">
      一份授权可在 2 台电脑上使用。<br />
      换电脑请把新机器的指纹发给发行方重新签发；重装系统不影响已激活状态。
    </p>

    <p class="act-alt"><button id="act-mode-online" type="button">改用密钥在线激活</button></p>
    <form id="act-online" hidden onsubmit="return false">
      <p class="act-label">授权密钥</p>
      <input id="act-key" type="text" spellcheck="false" autocomplete="off" placeholder="AV-XXXXX-XXXXX-XXXXX-XXXXX" />
      <button id="act-submit-online" type="button">在线激活</button>
    </form>
  </section>

  <script src="splash.js"></script>
  <script src="activate.js"></script>
</body>
</html>
