<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AssetVault · 正在启动</title>
<link rel="icon" href="/favicon.svg">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;
  background:#0d1117;color:#e7eaf0;font-synthesis:none;
  font-family:Inter,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
/* 背景两团缓慢漂移的黄绿光斑 */
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(72px);pointer-events:none;z-index:0}
body:before{width:430px;height:430px;left:-130px;top:-150px;background:radial-gradient(circle,#c9f58121,transparent 66%);animation:drift 15s ease-in-out infinite}
body:after{width:390px;height:390px;right:-140px;bottom:-160px;background:radial-gradient(circle,#6fa34d1c,transparent 66%);animation:drift 19s ease-in-out infinite reverse}
@keyframes drift{50%{transform:translate(28px,22px) scale(1.09)}}

.stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:15px;padding:22px}

.card{position:relative;width:min(90vw,398px);padding:34px 32px 27px;text-align:center;
  border:1px solid #27303d;border-radius:22px;
  background:linear-gradient(165deg,#18212b,#131b24 58%,#111821);
  box-shadow:0 26px 70px #00000073,inset 0 1px 0 #ffffff0a;
  transition:border-color .5s ease,box-shadow .5s ease;
  animation:cardIn .55s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes cardIn{from{opacity:0;transform:translateY(15px) scale(.97)}to{opacity:1;transform:none}}
.card.done{border-color:#4e6541;box-shadow:0 26px 70px #00000073,0 0 42px #c9f58121}

/* 吉祥物：一块会蹦的方糖，落地时压扁、腾空时拉长 */
.mascot{position:relative;height:126px;display:grid;place-items:center;cursor:pointer;user-select:none}
.mascot img{position:relative;z-index:2;width:112px;height:112px;transform-origin:50% 88%;
  animation:hop 1.4s cubic-bezier(.36,.07,.28,1) infinite;transition:filter .3s ease}
.mascot:hover img{filter:drop-shadow(0 0 14px #c9f58145)}
.mascot .shadow{position:absolute;bottom:3px;width:72px;height:13px;border-radius:50%;
  background:radial-gradient(ellipse at center,#000000a8,transparent 72%);
  animation:shade 1.4s cubic-bezier(.36,.07,.28,1) infinite}
@keyframes hop{
  0%,100%{transform:translateY(0) scale(1.05,.94)}
  9%{transform:translateY(1px) scale(1.1,.89)}
  38%{transform:translateY(-21px) scale(.95,1.07)}
  58%{transform:translateY(-23px) scale(1,1)}
  89%{transform:translateY(0) scale(1.07,.92)}}
@keyframes shade{
  0%,100%{transform:scale(1);opacity:.5}
  9%{transform:scale(1.13);opacity:.56}
  48%{transform:scale(.64);opacity:.19}
  89%{transform:scale(1.09);opacity:.52}}
.card.done .mascot img{animation:cheer .9s cubic-bezier(.3,1.4,.4,1) 1 both}
.card.done .mascot .shadow{animation:none;opacity:.34;transform:scale(1)}
@keyframes cheer{
  0%{transform:translateY(0) scale(1.05,.94)}
  26%{transform:translateY(-36px) scale(.92,1.11) rotate(-9deg)}
  56%{transform:translateY(0) scale(1.15,.85) rotate(6deg)}
  76%{transform:translateY(-10px) scale(1,1) rotate(-2deg)}
  100%{transform:none}}

/* 吉祥物周围飘着的小方块 */
.bit{position:absolute;width:8px;height:8px;border-radius:2.5px;background:#c9f581;opacity:.32}
.b1{left:7%;top:27%;animation:float 3.4s ease-in-out infinite}
.b2{right:9%;top:15%;animation:float 4.1s ease-in-out .5s infinite}
.b3{left:15%;bottom:17%;animation:float 3.8s ease-in-out 1s infinite}
.b4{right:13%;bottom:25%;animation:float 4.6s ease-in-out 1.6s infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(45deg);opacity:.72}}

h1{margin:16px 0 0;font-size:22px;font-weight:700;letter-spacing:-.4px}
.sub{margin:7px 0 0;font-size:10px;letter-spacing:2.6px;color:#6f7d8e}

/* 进度条：小吉祥物骑在进度头上往前挪 */
.track{position:relative;height:11px;margin:26px 4px 0;border-radius:999px;
  background:#0b1119;border:1px solid #27303d}
.fill{position:absolute;left:1px;top:1px;bottom:1px;width:0;border-radius:999px;
  background:linear-gradient(90deg,#7fbf55,#c9f581);box-shadow:0 0 14px #c9f58147}
.fill:after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:repeating-linear-gradient(118deg,#ffffff4d 0 6px,transparent 6px 15px);
  animation:stripe .85s linear infinite}
@keyframes stripe{to{background-position:26px 0}}
/* 小吉祥物骑在进度头上往前挪。它和进度条同为黄绿色，所以要用一圈深色投影把它从条上托起来 */
.runner{position:absolute;top:-18px;left:1px;width:24px;height:24px;margin-left:-12px;
  filter:drop-shadow(0 0 2px #0d1117) drop-shadow(0 1px 3px #000000b3);
  animation:bob .62s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(7deg)}}

.meta{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:15px 4px 0;font-size:11px}
.msg{color:#8893a3;transition:opacity .22s ease}
.msg.swap{opacity:0}
.pct{color:#c9f581;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:.4px}
.tip{margin:18px 0 0;font-size:10px;line-height:1.85;color:#5d6a7b}
.foot{margin:0;font-size:10px;color:#4c5967;letter-spacing:.4px}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="stage">
  <section class="card" id="card">
    <div class="mascot" id="mascot">
      <span class="shadow"></span>
      <img id="hero" src="/mascot.png" alt="AssetVault" draggable="false">
      <i class="bit b1"></i><i class="bit b2"></i><i class="bit b3"></i><i class="bit b4"></i>
    </div>
    <h1>AssetVault</h1>
    <p class="sub">本地 3D 模型库</p>
    <div class="track">
      <div class="fill" id="fill"></div>
      <img class="runner" id="runner" src="/mascot.png" alt="" draggable="false">
    </div>
    <div class="meta">
      <span class="msg" id="msg"></span>
      <span class="pct" id="pct">0%</span>
    </div>
    <p class="tip" id="tip">正在准备模型库，马上就好…</p>
  </section>
  <p class="foot">AssetVault <span id="ver"></span> · 仅本机访问</p>
</main>
<script src="/splash.js"></script>
</body>
</html>
